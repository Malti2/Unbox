name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen

      - name: Icon
        run: |
          mkdir -p Resources
          swift Scripts/make-icon.swift Resources/AppIcon.iconset
          iconutil -c icns Resources/AppIcon.iconset -o Resources/AppIcon.icns
          rm -rf Resources/AppIcon.iconset

      - name: Generate project
        run: xcodegen generate

      - name: Test and render screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/shots" xcodebuild test -project Unbox.xcodeproj -scheme Unbox \
            -destination 'platform=macOS' CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES 2>&1 | tee test.log | tail -n 80
          status=${PIPESTATUS[0]}
          mkdir -p shots && cp "$RUNNER_TEMP"/shots/*.png /tmp/unbox-shots/*.png shots/ 2>/dev/null || true
          exit $status

      - name: Build release app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION="0.0.0-dev"; fi
          MARKETING="${VERSION%%-*}"
          xcodebuild build -project Unbox.xcodeproj -scheme Unbox -configuration Release \
            -derivedDataPath build MARKETING_VERSION="$MARKETING" CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES
          codesign --force --deep --sign - build/Build/Products/Release/Unbox.app
          codesign --verify --deep --strict build/Build/Products/Release/Unbox.app

      - name: Disk image
        run: |
          mkdir -p dmgroot
          cp -R build/Build/Products/Release/Unbox.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -srcfolder dmgroot -format UDZO -volname Unbox Unbox.dmg

      - name: Window routing and placement on a real screen
        continue-on-error: true
        run: |
          APP="$PWD/build/Build/Products/Release/Unbox.app"
          W="$RUNNER_TEMP/route"; rm -rf "$W"; mkdir -p "$W/src/Sample.app/Contents/MacOS"
          printf '#!/bin/sh\nexit 0\n' > "$W/src/Sample.app/Contents/MacOS/Sample"; chmod +x "$W/src/Sample.app/Contents/MacOS/Sample"
          cat > "$W/src/Sample.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict><key>CFBundleIdentifier</key><string>de.malte.unbox.sample</string><key>CFBundleName</key><string>Sample</string><key>CFBundleExecutable</key><string>Sample</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>
          PLIST
          hdiutil create -srcfolder "$W/src" -format UDZO -volname Sample "$W/Sample.dmg" >/dev/null
          open -a "$APP" "$W/Sample.dmg"
          sleep 6
          swift Scripts/list-windows.swift Unbox | tee "$W/windows.txt"
          mkdir -p shots; screencapture -x shots/real-screen.png || true
          pkill -x Unbox || true
          for m in /tmp/unbox-*/*; do hdiutil detach -force "$m" >/dev/null 2>&1 || true; done
          grep -q '^COUNT 1$' "$W/windows.txt"

      - name: Publish screenshots to a review branch
        if: always() && github.ref_type == 'branch'
        run: |
          [ -d shots ] && ls shots/*.png >/dev/null 2>&1 || exit 0
          rm -rf "$RUNNER_TEMP/rev" && mkdir "$RUNNER_TEMP/rev" && cp shots/*.png "$RUNNER_TEMP/rev/"
          cd "$RUNNER_TEMP/rev"
          git init -q -b screenshots
          git config user.name "Malti2"
          git config user.email "Malti2@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for review"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: unbox
          path: |
            Unbox.dmg
            shots/*.png
          retention-days: 1

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" Unbox.dmg --title "$GITHUB_REF_NAME" --generate-notes $FLAGS
