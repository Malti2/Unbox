name: Unbox
options:
  bundleIdPrefix: de.malte
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Unbox:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        optional: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Unbox
        CFBundleDisplayName: Unbox
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDocumentTypes:
          - CFBundleTypeName: Disk Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.disk-image-udif]
            CFBundleTypeExtensions: [dmg]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malte.unbox
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
  UnboxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Unbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malte.unbox.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Unbox:
    build:
      targets:
        Unbox: all
    test:
      targets:
        - UnboxTests
